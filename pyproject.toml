[project]
name = "py-extended-types"
version = "0.6.0"
description = "TypeScript-style shape contracts (`@assert_shape`, `@assert_field`, Partial/Required/Pick/Omit/Record) for Python classes, checked statically"
readme = "README.md"
authors = [{ name = "Dragan Okanovic" }]
requires-python = ">=3.11"
# The checker builds on mypy's semantic analysis (and some of its internals, hence the
# upper bound). The decorators and helpers themselves only import the standard library.
dependencies = ["mypy>=2.4,<3"]

[project.urls]
Repository = "https://github.com/abstractalgo/py-extended-types"

[project.scripts]
py-extended-types = "py_extended_types.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_extended_types"]

[tool.hatch.build.targets.sdist]
# The VS Code extension lives in the same repo but isn't part of the Python package.
exclude = ["vscode"]

[dependency-groups]
# The package itself has no dependencies; these are for its tests and linting.
dev = [
    "attrs>=26.1.0",
    "mypy",
    "pydantic>=2",
    "pytest",
    "ruff",
    "typing-extensions",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_return_any = true
disallow_untyped_defs = true
