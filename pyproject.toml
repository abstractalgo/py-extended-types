[project]
name = "py-extended-types"
version = "0.2.0"
description = "TypeScript-style shape contracts (`@expect_shape`, Partial/Required/Pick/Omit/Record, Map/Filter) for Python classes"
readme = "README.md"
authors = [{ name = "Dragan Okanovic" }]
requires-python = ">=3.11"
# Kept dependency-free on purpose: the CLI injects this package into the target
# project's interpreter, so it must import cleanly alongside any pydantic version.
dependencies = []

[project.urls]
Repository = "https://github.com/abstractalgo/py-extended-types"

[project.scripts]
py-extended-types = "py_extended_types.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_extended_types"]

[tool.hatch.build.targets.sdist]
# The VS Code extension lives in the same repo but isn't part of the Python package.
exclude = ["vscode"]

[dependency-groups]
# The package itself has no dependencies; these are for its tests and linting.
dev = ["mypy", "pydantic>=2", "pytest", "ruff", "typing-extensions"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_return_any = true
disallow_untyped_defs = true
